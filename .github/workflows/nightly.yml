name: Nightly tests

# Runs once a day (and on demand).  Carries the macOS regression coverage that
# was moved off the per-PR path (testing.yml) because of macOS runners' 10x
# minute multiplier.  Use workflow_dispatch to run it against a branch before
# merging macOS-sensitive changes.
#
# Scheduled runs are skipped when master has not moved since the last completed
# nightly (pass or fail), so a quiet repo does not pay for identical macOS runs.
# Note this only tracks classic's own commits; changes that reach the build only
# through the clawpack superrepo (riemann, clawutil, ...) do not trigger a run.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

permissions:
  contents: read
  actions: read   # list previous nightly runs in the gate job

env:
  CLAW: ${{ github.workspace }}

jobs:
  changes:
    name: check for new commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
    - name: Compare HEAD to last completed nightly
      id: check
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ "${{ github.event_name }}" != "schedule" ]; then
          echo "run=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        last=$(gh run list -R "${{ github.repository }}" -w nightly.yml \
          -b "${{ github.ref_name }}" -s completed -L 20 \
          --json headSha,conclusion \
          --jq '[.[] | select(.conclusion == "success" or .conclusion == "failure")][0].headSha // ""')
        echo "HEAD: ${{ github.sha }}"
        echo "Last completed nightly: ${last:-none}"
        if [ "$last" = "${{ github.sha }}" ]; then
          echo "No new commits since last nightly; skipping macOS jobs."
          echo "run=false" >> "$GITHUB_OUTPUT"
        else
          echo "run=true" >> "$GITHUB_OUTPUT"
        fi

  regression-tests:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: >
      regression - ${{ matrix.os }} - ${{ matrix.toolchain.compiler }} ${{ matrix.build }} - py ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        build: [debug, opt]
        python-version: ['3.12']
        toolchain:
          - {compiler: gcc, version: 15}

    steps:
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up compilers
      uses: fortran-lang/setup-fortran@v1.10.0
      id: setup-fortran
      with:
        compiler: ${{ matrix.toolchain.compiler }}
        version: ${{ matrix.toolchain.version }}

    - name: Install python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install meson-python ninja pytest numpy

    - name: Checkout Clawpack
      uses: actions/checkout@v7.0.1
      with:
        repository: clawpack/clawpack
        submodules: true

    - name: Checkout Classic branch
      uses: actions/checkout@v7.0.1
      with:
        path: classic

    - name: Install clawpack python
      run: |
        pip install --no-build-isolation --editable .

    - name: Run regression tests
      run: |
        cd ${CLAW}/classic
        source .github/scripts/set_test_env.sh regression "${{ matrix.toolchain.compiler }}" "${{ matrix.build }}"
        echo "FFLAGS: $FFLAGS"
        echo "OMP_NUM_THREADS: $OMP_NUM_THREADS"
        pytest --basetemp=${CLAW}/classic/pytest_tmp -vv -s -o addopts="" -m "regression"

    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: test_results_nightly_${{ matrix.os }}_${{ matrix.toolchain.compiler }}_${{ matrix.build }}
        path: ${{ env.CLAW }}/classic/pytest_tmp
        if-no-files-found: ignore
